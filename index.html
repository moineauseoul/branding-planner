<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branding Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='13' font-size='14'%3E%F0%9F%93%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FBFAF7;
    --surface:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#6E6E6E;
    --ink-faint:#9C9C9C;
    --line:#E6E5E1;
    --line-strong:#D8D6D0;
    --accent-md:#D9822B;
    --accent-md-bg:#FBEEDD;
    --accent-offline:#C2568B;
    --accent-offline-bg:#F7E7EF;
    --accent-plan:#7048E8;
    --accent-plan-bg:#EFEAFB;
    --accent-mkt:#2F9E44;
    --accent-mkt-bg:#E6F4E9;
    --accent-global:#1C7ED6;
    --accent-global-bg:#E3F0FC;
    --accent-etc:#0C8599;
    --accent-etc-bg:#E0F4F6;
    --accent-neutral:#868E96;
    --accent-neutral-bg:#F1F1F0;
    --accent-red-bg:#FCE3E3;
    --accent-teal:#0C8599;
    --accent-teal-bg:#E0F4F6;
    --danger:#E03131;
    --weekend:#E03131;
    --today-bg:#E7EFFE;
    --today-ink:#3B5BDB;
    --today:#1A1A1A;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{
    font-family:'Noto Sans KR',sans-serif;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
    font-size:13px;
  }
  input,select,textarea{
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:8px 10px;
    width:100%;
  }
  textarea{ resize:vertical; min-height:64px; }
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
    outline:2px solid var(--accent-mkt);
    outline-offset:1px;
  }
  .wrap{
    max-width:1880px;
    margin:0 auto;
    padding:32px 40px 80px;
  }

  /* ---------- Header ---------- */
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    border-bottom:1px solid var(--line-strong);
    padding-bottom:20px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .brand-title{
    font-weight:700;
    font-size:30px;
    letter-spacing:-0.03em;
  }
  .top-actions{
    display:flex;
    gap:14px;
    align-items:center;
    padding-bottom:4px;
  }
  .top-actions button{
    color:var(--ink-soft);
    border-bottom:1px solid transparent;
    padding:2px 0;
  }
  .top-actions button:hover{ color:var(--ink); border-bottom-color:var(--ink-soft); }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:28px;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  .tab-btn{
    font-size:17px;
    padding:0 0 12px;
    color:var(--ink-faint);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab-btn.active{
    color:var(--ink);
    font-weight:700;
    border-bottom-color:var(--ink);
  }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .primary-btn{
    background:var(--ink);
    color:var(--bg);
    padding:8px 16px;
    border-radius:var(--radius);
    font-weight:600;
    white-space:nowrap;
  }
  .primary-btn:hover{ background:#3a3a3a; }

  /* ---------- Calendar sub-header ---------- */
  .cal-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:12px;
  }
  .cal-controls-left{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .cal-controls-right{ display:flex; align-items:center; gap:12px; }
  .month-nav{ display:flex; align-items:center; gap:14px; }
  .month-nav button{
    font-size:18px;
    color:var(--ink-soft);
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{ color:var(--ink); }
  .month-title{
    font-size:19px;
    font-weight:700;
    min-width:130px;
  }
  /* ---------- Month grid ---------- */
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:8px;
  }
  .weekday-row span{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-align:left;
    padding-left:2px;
  }
  .weekday-row span.weekend{ color:var(--weekend); }
  .month-grid-wrap{ position:relative; }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:170px;
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .month-bars-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .month-bar{
    position:absolute;
    height:24px;
    border-radius:2px;
    font-size:12.5px;
    font-weight:500;
    display:flex;
    align-items:center;
    padding:3px 6px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    cursor:pointer;
    pointer-events:auto;
    box-sizing:border-box;
  }
  .month-bar.done-item{ text-decoration:line-through; opacity:0.7; }
  .day-cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:10px 10px 6px;
    display:flex;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    background:var(--surface);
    position:relative;
    overflow:hidden;
  }
  .day-cell:hover{ background:#F7F7F5; }
  .day-cell.muted{ background:var(--bg); color:var(--ink-faint); }
  .day-cell.selected{ outline:2px solid var(--ink); outline-offset:-2px; z-index:1; }
  .day-cell.today{ background:var(--today-bg); }
  .day-cell.today:hover{ background:var(--today-bg); }
  .day-num{
    font-size:14px;
    font-weight:600;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
  }
  .day-num.weekend{ color:var(--weekend); }
  .day-cell.today .day-num{
    color:var(--today-ink);
    font-weight:700;
  }
  .day-items{ display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .day-item-tag{
    font-size:12.5px;
    font-weight:500;
    padding:3px 6px;
    border-radius:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
  }
  .day-item-tag.done-item{ text-decoration:line-through; opacity:0.7; }
  .day-item-tag.request-tag{
    background:var(--surface);
    border-left:3px solid var(--ink-faint);
    padding:3px 6px 3px 7px;
    font-weight:600;
  }
  .request-tag.dept-md{ border-left-color:var(--accent-md); color:var(--accent-md); }
  .request-tag.dept-offline{ border-left-color:var(--accent-offline); color:var(--accent-offline); }
  .request-tag.dept-mkt{ border-left-color:var(--accent-mkt); color:var(--accent-mkt); }
  .request-tag.dept-plan{ border-left-color:var(--accent-plan); color:var(--accent-plan); }
  .request-tag.dept-global{ border-left-color:var(--accent-global); color:var(--accent-global); }
  .request-tag.dept-etc{ border-left-color:var(--accent-etc); color:var(--accent-etc); }
  .day-more{ font-size:11px; color:var(--ink-faint); }

  .dept-md{ background:var(--accent-md-bg); color:var(--accent-md); }
  .dept-offline{ background:var(--accent-offline-bg); color:var(--accent-offline); }
  .dept-plan{ background:var(--accent-plan-bg); color:var(--accent-plan); }
  .dept-mkt{ background:var(--accent-mkt-bg); color:var(--accent-mkt); }
  .dept-global{ background:var(--accent-global-bg); color:var(--accent-global); }
  .dept-etc{ background:var(--accent-etc-bg); color:var(--accent-etc); }
  .dept-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:5px; flex-shrink:0;
  }
  .dept-dot.dept-md{ background:var(--accent-md); }
  .dept-dot.dept-offline{ background:var(--accent-offline); }
  .dept-dot.dept-plan{ background:var(--accent-plan); }
  .dept-dot.dept-mkt{ background:var(--accent-mkt); }
  .dept-dot.dept-global{ background:var(--accent-global); }
  .dept-dot.dept-etc{ background:var(--accent-etc); }

  /* 일정 배경색: 사용자가 직접 고른 hex 컬러를 인라인 스타일로 적용 (프리셋 없음) */
  .color-input-row{ display:flex; align-items:center; gap:10px; }
  .color-input-row input[type="color"]{
    width:44px; height:36px;
    padding:2px;
    cursor:pointer;
  }
  .color-input-row input[type="text"]{ width:120px; text-transform:uppercase; }
  .fav-color-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .fav-color-list{ display:flex; gap:8px; }
  .fav-color-swatch{
    width:24px; height:24px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    cursor:pointer;
    padding:0;
  }
  .fav-color-swatch.empty{ background:var(--bg); border-style:dashed; cursor:default; }
  .fav-color-save-btn{ font-size:12px; color:var(--ink-soft); border-bottom:1px solid var(--line-strong); }
  .fav-color-save-btn:hover{ color:var(--ink); border-bottom-color:var(--ink); }

  /* ---------- Day / week panel ---------- */
  .month-view-layout{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:28px;
    align-items:start;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    position:sticky;
    top:24px;
  }
  .panel-date{
    font-size:14px;
    font-weight:700;
    margin-bottom:12px;
  }
  .item-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .item-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    cursor:pointer;
  }
  .item-row:hover{ border-color:var(--line-strong); background:#FAFAF8; }
  .item-row .item-main{ flex:1; min-width:0; }
  .item-title{ font-size:13.5px; margin-bottom:2px; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .item-title.done-item{ text-decoration:line-through; color:var(--ink-faint); }
  .item-meta{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .item-badge{
    font-size:10px;
    color:var(--ink-faint);
    border:1px solid var(--line-strong);
    border-radius:2px;
    padding:0 5px;
  }
  .empty-note{
    font-size:13px;
    color:var(--ink-faint);
    padding:14px 0;
  }

  /* ---------- Requests tab ---------- */
  .req-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:12px;
  }
  .req-toolbar-right{ display:flex; align-items:center; gap:10px; }
  .req-search{ width:200px; }
  .dept-filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .dept-filter-btn{
    padding:6px 12px;
    border:1px solid var(--line-strong);
    border-radius:14px;
    color:var(--ink-soft);
    font-size:12.5px;
  }
  .dept-filter-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }

  .columns{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }
  .col-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--ink);
    padding-bottom:8px;
    margin-bottom:12px;
  }
  .col-head h3{
    font-weight:600;
    font-size:15px;
    margin:0;
  }
  .col-head span{ font-size:11px; color:var(--ink-faint); }
  .req-card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .req-card:hover{ border-color:var(--line-strong); background:#FAFAF8; }
  .req-card-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px;
  }
  .req-dept-tag{
    font-size:10.5px;
    padding:2px 7px;
    border-radius:2px;
    display:inline-flex; align-items:center;
  }
  .req-priority{ font-size:11px; }
  .req-priority.high{ color:var(--danger); }
  .req-priority.mid{ color:var(--ink-soft); }
  .req-priority.low{ color:var(--ink-faint); }
  .req-title{ font-size:13.5px; margin-bottom:6px; }
  .req-title.done-item{ text-decoration:line-through; color:var(--ink-faint); }
  .req-due{ font-size:11px; color:var(--ink-faint); margin-bottom:8px; }
  .req-due.due-overdue{ color:var(--danger); font-weight:700; }
  .req-due.due-soon{ color:var(--accent-md); font-weight:700; }
  .req-card.due-overdue{ border-left:3px solid var(--danger); }
  .req-card.due-soon{ border-left:3px solid var(--accent-md); }

  /* ---------- 이번 주 요약 ---------- */
  .week-summary-box{
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    background:var(--surface);
    padding:14px 16px;
    margin-bottom:20px;
  }
  .week-summary-empty{ font-size:13px; color:var(--ink-faint); }
  .week-summary-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
  .week-summary-list{ display:flex; flex-direction:column; gap:6px; }
  .week-summary-item{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px;
    border-radius:var(--radius);
    text-align:left;
    width:100%;
  }
  .week-summary-item:hover{ background:var(--bg); }
  .week-summary-item-title{ flex:1; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .week-summary-item-title.due-overdue{ color:var(--danger); font-weight:700; }
  .week-summary-item-title.due-soon{ color:var(--accent-md); font-weight:700; }
  .week-summary-item-due{ font-size:11px; color:var(--ink-faint); flex-shrink:0; }
  .req-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .detail-status-actions{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .req-actions button{ font-size:11.5px; color:var(--ink-soft); border-bottom:1px solid var(--line-strong); }
  .req-actions button:hover{ color:var(--ink); border-bottom-color:var(--ink); }

  /* ---------- Memo board ---------- */
  .memo-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .memo-toolbar-note{ font-size:12.5px; color:var(--ink-faint); max-width:520px; }
  .memo-board{
    display:flex;
    flex-wrap:wrap;
    gap:28px 24px;
    padding:6px 4px 40px;
  }
  .memo-note{
    width:190px;
    min-height:170px;
    padding:18px 16px 30px;
    position:relative;
    box-shadow:2px 4px 10px rgba(30,25,15,0.12);
    cursor:pointer;
    font-size:13px;
    line-height:1.6;
    color:#2b2b2b;
    white-space:pre-wrap;
    word-break:break-word;
    transition:transform .15s ease;
  }
  .memo-note:hover{ transform:scale(1.04) !important; z-index:2; box-shadow:3px 6px 14px rgba(30,25,15,0.18); }
  .memo-pin{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    width:11px; height:11px;
    border-radius:50%;
    background:rgba(0,0,0,0.28);
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
  }
  .memo-delete{
    position:absolute;
    top:8px; right:10px;
    font-size:13px;
    color:rgba(0,0,0,0.32);
    line-height:1;
  }
  .memo-delete:hover{ color:var(--danger); }
  .memo-date{
    position:absolute;
    bottom:10px; right:14px;
    font-size:10px;
    color:rgba(0,0,0,0.35);
  }
  .memo-color-picker{ display:flex; gap:10px; flex-wrap:wrap; }
  .memo-swatch{
    width:26px; height:26px;
    border-radius:4px;
    border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--line-strong);
    cursor:pointer;
    padding:0;
  }
  .memo-swatch.selected{ box-shadow:0 0 0 2px var(--ink); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(20,18,15,0.45);
    align-items:center; justify-content:center;
    padding:24px;
    z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--surface);
    border-radius:calc(var(--radius) + 3px);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    padding:24px;
  }
  #detail-modal .modal-box{
    max-width:600px;
    padding:30px;
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px;
  }
  .modal-head h2{ font-size:18px; font-weight:700; margin:0; }
  .modal-close{ font-size:18px; color:var(--ink-faint); width:24px; height:24px; }
  .modal-close:hover{ color:var(--ink); }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .modal-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-footer{
    display:flex; justify-content:flex-end; gap:10px;
    margin-top:6px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .modal-footer button{ padding:8px 16px; border-radius:var(--radius); }
  .modal-cancel{ color:var(--ink-soft); border:1px solid var(--line-strong); }
  .modal-cancel:hover{ color:var(--ink); border-color:var(--ink); }
  .modal-delete{ color:var(--danger); border:1px solid var(--danger); }
  .modal-delete:hover{ background:var(--danger); color:#fff; }
  .detail-footer{ justify-content:space-between; }
  .detail-delete-link{ color:var(--danger); font-size:12.5px; border-bottom:1px solid transparent; padding:8px 4px; }
  .detail-delete-link:hover{ border-bottom-color:var(--danger); }
  .field-hint{ font-size:11px; color:var(--ink-faint); margin-top:4px; }
  .owner-only-hidden{ display:none; }
  #login-error{ color:var(--danger); }
  .rte-toolbar{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .rte-btn{
    width:28px; height:28px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    font-size:12.5px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .rte-btn:hover{ color:var(--ink); border-color:var(--ink); }
  .rte-editor{
    min-height:80px;
    max-height:220px;
    overflow-y:auto;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:8px 10px;
    font-size:13px;
    color:var(--ink);
    background:var(--surface);
    line-height:1.6;
  }
  .rte-editor:focus-visible{ outline:2px solid var(--accent-mkt); outline-offset:1px; }
  .detail-content-box.rich{ white-space:normal; }
  .links-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .link-row{ display:flex; gap:8px; align-items:center; }
  .link-row select{ width:120px; flex-shrink:0; }
  .link-row input{ flex:1; min-width:0; }
  .link-remove{ color:var(--ink-faint); font-size:15px; flex-shrink:0; width:22px; text-align:center; }
  .link-remove:hover{ color:var(--danger); }

  function dueUrgency(due, status){
    if(!due || status==="done") return "none";
    const t = todayStr();
    if(due < t) return "overdue";
    const td = new Date(t+"T00:00:00");
    const tomorrow = new Date(td);
    tomorrow.setDate(td.getDate()+1);
    if(due === t || due === fmtDate(tomorrow)) return "soon";
    return "none";
  }

  function renderMonth(){
    monthTitleEl.textContent = `${current.getFullYear()}년 ${current.getMonth()+1}월`;
    monthGridEl.innerHTML = "";
    const barsLayer = document.getElementById("month-bars-layer");
    barsLayer.innerHTML = "";

    const year = current.getFullYear(), month = current.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay(); // 일요일 시작
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth)/7)*7;

    const cellByDate = {}; // dateStr -> cell element
    const weekDates = []; // 주 단위로 묶은 dateStr 배열들

    for(let i=0;i<totalCells;i++){
      const dayNum = i - startOffset + 1;
      let cellDate, muted=false;
      if(dayNum < 1){
        cellDate = new Date(year, month-1, daysInPrevMonth + dayNum);
        muted = true;
      } else if(dayNum > daysInMonth){
        cellDate = new Date(year, month+1, dayNum - daysInMonth);
        muted = true;
      } else {
        cellDate = new Date(year, month, dayNum);
      }
      const dateStr = fmtDate(cellDate);
      const dow = cellDate.getDay(); // 0=일 ... 6=토
      const isWeekend = dow===0 || dow===6;

      const weekIdx = Math.floor(i/7);
      if(!weekDates[weekIdx]) weekDates[weekIdx] = [];
      weekDates[weekIdx].push(dateStr);

      const cell = document.createElement("div");
      cell.className = "day-cell" + (muted?" muted":"") + (dateStr===todayStr()?" today":"") + (dateStr===selectedDate?" selected":"");
      cell.dataset.date = dateStr;
      cellByDate[dateStr] = cell;

      const numEl = document.createElement("div");
      numEl.className = "day-num" + (isWeekend?" weekend":"");
      numEl.textContent = cellDate.getDate();
      cell.appendChild(numEl);

      // 여러 날에 걸친(기간) 일정은 아래에서 막대로 따로 그리므로, 셀 안 미니 태그에서는 제외
      const allItems = itemsForDate(dateStr);
      const items = allItems.filter(it => !(it.source==="schedule" && it.startDate!==it.endDate));

      const itemsWrap = document.createElement("div");
      itemsWrap.className = "day-items";
      items.slice(0,3).forEach(it=>{
        const tag = document.createElement("div");
        if(it.source==="schedule"){
          tag.className = "day-item-tag" + (it.done?" done-item":"");
          tag.style.background = it.color;
          tag.style.color = readableTextColor(it.color);
        } else {
          tag.className = "day-item-tag request-tag "+tagClassFor(it) + (it.done?" done-item":"");
        }
        tag.textContent = it.title;
        tag.addEventListener("click", e=>{
          e.stopPropagation();
          openDetail(it.source, it.id);
        });
        itemsWrap.appendChild(tag);
      });
      if(items.length>3){
        const more = document.createElement("div");
        more.className = "day-more";
        more.textContent = `+${items.length-3}건 더`;
        itemsWrap.appendChild(more);
      }
      cell.appendChild(itemsWrap);

      cell.addEventListener("click", ()=>{
        selectedDate = dateStr;
        renderMonth();
      });
      monthGridEl.appendChild(cell);
    }

    // ---- 기간(여러 날) 일정을 주 단위로 이어진 막대로 렌더링 ----
    const wrapRect = document.getElementById("month-grid-wrap").getBoundingClientRect();
    const BAR_H = 24, BAR_GAP = 2;

    weekDates.forEach(week=>{
      const weekStart = week[0], weekEnd = week[week.length-1];
      const multiDaySchedules = state.schedules.filter(s=>{
        const start = s.startDate||s.date, end = s.endDate||start;
        return end!==start && start<=weekEnd && end>=weekStart;
      });
      // 주 시작일 기준 컬럼 인덱스로 클립
      const segments = multiDaySchedules.map(s=>{
        const start = s.startDate||s.date, end = s.endDate||start;
        const clipStart = start<weekStart ? weekStart : start;
        const clipEnd = end>weekEnd ? weekEnd : end;
        const startCol = week.indexOf(clipStart);
        const endCol = week.indexOf(clipEnd);
        return { schedule:s, startCol, endCol };
      }).sort((a,b)=> a.startCol - b.startCol || (b.endCol-b.startCol)-(a.endCol-a.startCol));

      // 레인 배정 (겹치지 않는 것끼리 같은 줄에)
      const lanes = []; // 각 레인: 마지막으로 배정된 endCol
      segments.forEach(seg=>{
        let laneIdx = lanes.findIndex(lastEnd=> lastEnd < seg.startCol);
        if(laneIdx===-1){ laneIdx = lanes.length; lanes.push(seg.endCol); }
        else{ lanes[laneIdx] = seg.endCol; }
        seg.lane = laneIdx;
      });
      if(segments.length===0) return;

      // marginTop을 적용하기 전, 태그가 원래 시작되는 실제 위치를 측정 (같은 주는 모두 동일)
      const refCell = cellByDate[week[0]];
      const refWrap = refCell ? refCell.querySelector(".day-items") : null;
      const baseTop = refWrap ? (refWrap.getBoundingClientRect().top - wrapRect.top) : 0;

      // 막대가 실제로 덮는 날짜의 셀만, 덮는 만큼의 높이로 미니 태그 목록을 아래로 밀어줌
      const colCoverage = new Array(7).fill(0);
      segments.forEach(seg=>{
        for(let c=seg.startCol;c<=seg.endCol;c++){
          colCoverage[c] = Math.max(colCoverage[c], seg.lane+1);
        }
      });
      week.forEach((dateStr, colIdx)=>{
        const cell = cellByDate[dateStr];
        if(cell){
          const wrap = cell.querySelector(".day-items");
          if(wrap) wrap.style.marginTop = (colCoverage[colIdx]*(BAR_H+BAR_GAP))+"px";
        }
      });

      segments.forEach(seg=>{
        const startCell = cellByDate[week[seg.startCol]];
        const endCell = cellByDate[week[seg.endCol]];
        if(!startCell || !endCell) return;
        const startRect = startCell.getBoundingClientRect();
        const endRect = endCell.getBoundingClientRect();
        const s = seg.schedule;
        const color = resolveScheduleColor(s.color);
        const bar = document.createElement("div");
        bar.className = "month-bar";
        bar.style.left = (startRect.left - wrapRect.left + 6) + "px";
        bar.style.width = (endRect.right - startRect.left - 12) + "px";
        bar.style.top = (baseTop + seg.lane*(BAR_H+BAR_GAP)) + "px";
        bar.style.background = color;
        bar.style.color = readableTextColor(color);
        bar.textContent = s.title;
        bar.addEventListener("click", ()=> openDetail("schedule", s.id));
        barsLayer.appendChild(bar);
      });
    });

    renderDayPanel();
  }

  async function updateStatus(id, status){
    const { error } = await sb.from("requests").update({ status }).eq("id", id);
    if(error) alert("상태 변경 실패: "+error.message);
  }

  function renderRequests(){
    const q = reqSearchQuery.trim().toLowerCase();
    const filtered = state.requests.filter(r=>{
      const deptMatch = reqDeptFilter==="all" || r.dept===reqDeptFilter;
      const searchMatch = !q ||
        (r.title && r.title.toLowerCase().includes(q)) ||
        (r.content && stripHtml(r.content).toLowerCase().includes(q));
      return deptMatch && searchMatch;
    });
    const byStatus = { waiting:[], progress:[], done:[] };
    filtered
      .slice()
      .sort((a,b)=> (a.due||"9999").localeCompare(b.due||"9999"))
      .forEach(r=> byStatus[r.status].push(r));

    ["waiting","progress","done"].forEach(status=>{
      const col = document.getElementById("col-"+status);
      col.innerHTML = "";
      if(byStatus[status].length===0){
        const empty = document.createElement("div");
        empty.className = "empty-note";
        empty.textContent = "아직 여기 있는 요청이 없어요.";
        col.appendChild(empty);
      } else {
        byStatus[status].forEach(r=> col.appendChild(requestCard(r)));
      }
    });
    document.getElementById("count-waiting").textContent = byStatus.waiting.length;
    document.getElementById("count-progress").textContent = byStatus.progress.length;
    document.getElementById("count-done").textContent = byStatus.done.length;
    renderWeekSummary();
  }
  document.getElementById("req-search").addEventListener("input", e=>{
    reqSearchQuery = e.target.value;
    renderRequests();
  });

  /* ================= 이번 주 요약 (실제 오늘 기준, 캘린더 탭 상단) ================= */
  function renderWeekSummary(){
    const box = document.getElementById("week-summary-box");
    if(!box) return;
    const now = new Date();
    now.setHours(0,0,0,0);
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay()); // 일요일 시작
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate()+6);
    const weekStartStr = fmtDate(weekStart), weekEndStr = fmtDate(weekEnd);

    const dueThisWeek = state.requests
      .filter(r=> r.due && r.due>=weekStartStr && r.due<=weekEndStr && r.status!=="done")
      .sort((a,b)=> a.due.localeCompare(b.due));

    if(dueThisWeek.length===0){
      box.innerHTML = `<div class="week-summary-empty">이번 주 마감 예정인 요청이 없어요.</div>`;
      return;
    }
    box.innerHTML = `<div class="week-summary-title">이번 주 마감 요청 ${dueThisWeek.length}건</div>` +
      `<div class="week-summary-list">` +
      dueThisWeek.map(r=>{
        const urgency = dueUrgency(r.due, r.status);
        const urgencyClass = urgency==="overdue" ? " due-overdue" : urgency==="soon" ? " due-soon" : "";
        return `<button type="button" class="week-summary-item" data-id="${r.id}">
          <span class="req-dept-tag dept-${r.dept}">${DEPT_LABEL[r.dept]}</span>
          <span class="week-summary-item-title${urgencyClass}">${escapeHtml(r.title)}</span>
          <span class="week-summary-item-due">${r.due}</span>
        </button>`;
      }).join('') +
      `</div>`;
    box.querySelectorAll(".week-summary-item").forEach(btn=>{
      btn.addEventListener("click", ()=> openDetail("request", btn.dataset.id));
    });
  }

  /* ================= DETAIL POPUP (일정/요청 공용) ================= */
  function detailStatusBtn(label, onClick){
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }
  async function updateStatusAndRefresh(id, status){
    await updateStatus(id, status);
    openDetail("request", id);
  }
  function openDetail(type, id){
    const body = document.getElementById("detail-body");
    if(type==="schedule"){
      const s = state.schedules.find(x=>x.id===id);
      if(!s) return;
      detailContext = { type:"schedule", id };
      document.getElementById("detail-modal-title").textContent = "일정 상세";
      const start = s.startDate||s.date, end = s.endDate||start;
      body.innerHTML = `
        <div class="detail-title"><span class="dept-dot" style="width:10px;height:10px;background:${resolveScheduleColor(s.color)};"></span>${escapeHtml(s.title)}</div>
        ${s.content ? `<div class="detail-content-label">내용</div><div class="detail-content-box">${escapeHtml(s.content)}</div>` : ``}
        <div class="detail-meta-grid">
          <div class="detail-meta-cell${s.requester?"":" full"}"><div class="k">${end!==start ? "기간" : "날짜"}</div><div class="v">${end!==start ? `${start} ~ ${end}` : start}</div></div>
          ${s.requester ? `<div class="detail-meta-cell"><div class="k">요청자</div><div class="v">${escapeHtml(s.requester)}</div></div>` : ``}
        </div>
      `;
    } else {
      const r = state.requests.find(x=>x.id===id);
      if(!r) return;
      detailContext = { type:"request", id };
      document.getElementById("detail-modal-title").textContent = "요청 상세";
      const links = r.links && r.links.length ? r.links : (r.url ? [{type:"etc", url:r.url}] : []);
      const detailDueUrgency = dueUrgency(r.due, r.status);
      const linksHtml = links.map(l=>{
        const safeUrl = escapeHtml(l.url);
        return `<div class="detail-meta-cell"><div class="k">${LINK_TYPE_LABEL[l.type]||"기타"}</div><div class="v"><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">바로가기</a></div></div>`;
      }).join("");
      body.innerHTML = `
        <div class="detail-top-chips">
          <span class="req-dept-tag dept-${r.dept}">${DEPT_LABEL[r.dept]}</span>
          <span class="req-priority ${r.priority}">${PRIORITY_LABEL[r.priority]}</span>
          <span class="status-pill status-${r.status}">${STATUS_LABEL[r.status]}</span>
        </div>
        <div class="detail-title${r.status==="done"?" done-item":""}">${escapeHtml(r.title)}</div>
        ${r.content && stripHtml(r.content).trim() ? `<div class="detail-content-label">내용</div><div class="detail-content-box rich">${r.content}</div>` : ``}
        <div class="detail-meta-grid">
          ${r.requester ? `<div class="detail-meta-cell"><div class="k">요청자</div><div class="v">${escapeHtml(r.requester)}</div></div>` : ``}
          ${r.assignee ? `<div class="detail-meta-cell"><div class="k">담당자</div><div class="v">${escapeHtml(r.assignee)}</div></div>` : ``}
          ${r.due ? `<div class="detail-meta-cell"><div class="k">마감일</div><div class="v"><span class="${detailDueUrgency==="overdue"?"due-overdue":detailDueUrgency==="soon"?"due-soon":""}">${r.due}${detailDueUrgency==="overdue"?" · 지연":detailDueUrgency==="soon"?" · 임박":""}</span></div></div>` : ``}
          ${linksHtml}
        </div>
        ${isOwner ? `<div class="req-actions detail-status-actions" id="detail-status-actions"></div>` : ``}
      `;
      if(isOwner){
        const statusBox = document.getElementById("detail-status-actions");
        if(r.status==="waiting"){
          statusBox.appendChild(detailStatusBtn("진행중으로", ()=>updateStatusAndRefresh(r.id,"progress")));
        } else if(r.status==="progress"){
          statusBox.appendChild(detailStatusBtn("대기로", ()=>updateStatusAndRefresh(r.id,"waiting")));
          statusBox.appendChild(detailStatusBtn("완료로", ()=>updateStatusAndRefresh(r.id,"done")));
        } else {
          statusBox.appendChild(detailStatusBtn("다시 열기", ()=>updateStatusAndRefresh(r.id,"progress")));
        }
      }
    }
    openModal("detail-modal");
  }

  document.getElementById("detail-edit-btn").addEventListener("click", ()=>{
    if(!detailContext) return;
    closeModal("detail-modal");
    if(detailContext.type==="schedule"){
      const s = state.schedules.find(x=>x.id===detailContext.id);
      if(s) openScheduleModalForEdit(s);
    } else {
      const r = state.requests.find(x=>x.id===detailContext.id);
      if(r) openRequestModalForEdit(r);
    }
  });
  document.getElementById("detail-delete-btn").addEventListener("click", async ()=>{
    if(!detailContext) return;
    if(!confirm("삭제할까요? 삭제 후에는 복구할 수 없습니다.")) return;
    const table = detailContext.type==="schedule" ? "schedules" : "requests";
    const { error } = await sb.from(table).delete().eq("id", detailContext.id);
    if(error){ alert("삭제 실패: "+error.message); return; }
    closeModal("detail-modal");
    detailContext = null;
  });

  /* ================= BACKUP (내보내기만 제공 — 공유 DB이므로 가져오기는 제공하지 않음) ================= */
  document.getElementById("export-btn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `branding-planner-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  /* ================= 인증 (로그인한 본인만 쓰기 가능) ================= */
  function applyOwnerUI(){
    document.querySelectorAll(".owner-only").forEach(el=> el.classList.toggle("owner-only-hidden", !isOwner));
    document.getElementById("login-btn").style.display = isOwner ? "none" : "";
    renderCalendar();
    renderRequests();
    renderMemos();
  }

  document.getElementById("login-btn").addEventListener("click", ()=>{
    document.getElementById("login-form").reset();
    document.getElementById("login-error").style.display = "none";
    openModal("login-modal");
  });
  document.getElementById("logout-btn").addEventListener("click", async ()=>{
    await sb.auth.signOut();
  });
  document.getElementById("login-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errEl = document.getElementById("login-error");
    errEl.style.display = "none";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      errEl.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인해주세요.";
      errEl.style.display = "block";
      return;
    }
    closeModal("login-modal");
  });
  sb.auth.onAuthStateChange((_event, session)=>{
    isOwner = !!session;
    applyOwnerUI();
  });

  /* ================= 데이터 불러오기 + 실시간 동기화 ================= */
  async function initialLoad(){
    const [schedRes, reqRes, memoRes] = await Promise.all([
      sb.from("schedules").select("*"),
      sb.from("requests").select("*"),
      sb.from("memos").select("*")
    ]);
    if(schedRes.error || reqRes.error || memoRes.error){
      console.error(schedRes.error||reqRes.error||memoRes.error);
      alert("데이터를 불러오지 못했어요. 잠시 후 새로고침해주세요.");
      return;
    }
    state.schedules = (schedRes.data||[]).map(scheduleRowToObj);
    state.requests = (reqRes.data||[]).map(requestRowToObj);
    state.memos = (memoRes.data||[]).map(memoRowToObj);
    renderCalendar();
    renderRequests();
    renderMemos();
  }

  function applyRealtimeChange(arrName, mapFn, payload){
    const arr = state[arrName];
    if(payload.eventType === "INSERT"){
      if(!arr.find(x=>x.id===payload.new.id)) arr.push(mapFn(payload.new));
    } else if(payload.eventType === "UPDATE"){
      const idx = arr.findIndex(x=>x.id===payload.new.id);
      const obj = mapFn(payload.new);
      if(idx>-1) arr[idx] = obj; else arr.push(obj);
    } else if(payload.eventType === "DELETE"){
      state[arrName] = arr.filter(x=>x.id!==payload.old.id);
    }
  }

  sb.channel("schedules-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"schedules" }, payload=>{
      applyRealtimeChange("schedules", scheduleRowToObj, payload);
      renderCalendar();
    }).subscribe();
  sb.channel("requests-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"requests" }, payload=>{
      applyRealtimeChange("requests", requestRowToObj, payload);
      renderRequests();
      renderCalendar();
    }).subscribe();
  sb.channel("memos-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"memos" }, payload=>{
      applyRealtimeChange("memos", memoRowToObj, payload);
      renderMemos();
    }).subscribe();

  /* ================= INIT ================= */
  initialLoad();

  let resizeTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderCalendar, 200);
  });
})();
</script>
